<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAR Paternoster - Warenausgabesystem</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Override body for futuristic start page */
       body {
            background: linear-gradient(135deg, #0a0a0a, #001122);
            font-family: 'Orbitron', monospace;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            height: 100vh;
            padding: 40px;
            box-sizing: border-box;
        }
        .screen-card {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
        }
        .screen-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        .screen-card:hover::before {
            left: 100%;
        }
        .screen-card:hover {
            transform: scale(1.05);
            border-color: #00ffff;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.3);
        }
        .screen-icon {
            font-size: 120px;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .screen-title {
            font-size: 32px;
            font-weight: 700;
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        .screen-description {
            color: #a0a0a0;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
        }
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            text-align: center;
            z-index: 10;
        }
        .header-title {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            margin: 0;
        }
        .header-subtitle {
            font-size: 24px;
            color: #8e2de2;
            margin: 10px 0 0 0;
            text-shadow: 0 0 15px rgba(142, 45, 226, 0.5);
        }
        .network-pulse {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.1) 1%, transparent 10%);
            animation: networkPulse 4s infinite;
            pointer-events: none;
        }
        @keyframes networkPulse {
            0%, 100% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="header-title">SAR PATERNOSTER</h1>
        <p class="header-subtitle">SAR Paternoster - Modern Warehouse System</p>
    </div>
    <div class="container">
        <div class="screen-card" onclick="window.open('pages/ausgabe.html', '_blank', 'width=1000,height=700')">
            <div class="network-pulse"></div>
            <div class="screen-icon">⚡</div>
            <h2 class="screen-title">DISPENSATION INTERFACE</h2>
            <p class="screen-description">Advanced scanning and item retrieval system with AI-powered optimization.</p>
        </div>
        <div class="screen-card" onclick="window.open('pages/admin.html', '_blank', 'width=1200,height=800')">
            <div class="network-pulse"></div>
            <div class="screen-icon">🧠</div>
            <h2 class="screen-title">ADMINISTRATION CORE</h2>
            <p class="screen-description">Central management hub for inventory control and system configuration.</p>
        </div>
    </div>
    <script>
        // Enhanced window opening for 2025 experience
        document.addEventListener('DOMContentLoaded', function() {
            // Add entrance animation
            document.querySelectorAll('.screen-card').forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(50px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.8s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 200);
            });
        });
    </script>
</body>
</html>
